apply plugin: 'com.android.application'

// Keep the upload key and its passwords outside source control.
def uploadProperties = new Properties()
def uploadPropertiesFile = rootProject.file('keystore.properties')
if (uploadPropertiesFile.exists()) {
    uploadPropertiesFile.withInputStream { uploadProperties.load(it) }
}
def gameVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../../public/version.json')).version
// The Play version code is the game version's own number (0.901.45 -> 9010450, a fourth part in the last
// digit), so a bundle and its game always match and every release is higher than the last. -PwildstatVersionCode overrides it.
def versionParts = gameVersion.tokenize('.').collect { it.toInteger() } + [0, 0, 0, 0]
def gameVersionCode = ((versionParts[0] * 1000 + versionParts[1]) * 1000 + versionParts[2]) * 10 + versionParts[3]
// The game copied into the app must be this version: built and synced after the version moved, not before.
def stagedBuild = rootProject.file('app/src/main/assets/public/ota-build.json')
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
        def staged = stagedBuild.exists() ? new groovy.json.JsonSlurper().parse(stagedBuild).version : null
        if (staged != gameVersion) throw new GradleException("The app holds game ${staged ?: 'nothing'} but the game is ${gameVersion}. Run: npm --prefix mobile run build && (cd mobile && npx cap sync android)")
    }
}


android {
    namespace = "com.wildstatmmo.preview"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.wildstatmmo.preview"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = (project.findProperty("wildstatVersionCode") ?: gameVersionCode).toInteger()
        versionName gameVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (uploadPropertiesFile.exists()) {
            release {
                storeFile rootProject.file(uploadProperties['storeFile'])
                storePassword uploadProperties['storePassword']
                keyAlias uploadProperties['keyAlias']
                keyPassword uploadProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (uploadPropertiesFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Internal testing is still a release build: RevenueCat Test Store keys crash it.
tasks.register('verifyReleaseCommerce') {
    doLast {
        def manifest = file('src/main/assets/public/native-build.json')
        if (!manifest.exists() || new groovy.json.JsonSlurper().parse(manifest).testPurchasesEnabled != false) {
            throw new GradleException('Release bundles must disable Test Store purchases. Run npm --prefix mobile run build, then cap sync android.')
        }
    }
}
tasks.configureEach {
    if (name == 'preReleaseBuild') dependsOn('verifyReleaseCommerce')
}

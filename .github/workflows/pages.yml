name: Deploy WildStat to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The site build, the typechecks and the tests run side by side; the app
  # update and the deploy wait for all of them. One job ran them in a row in
  # about three and a half minutes, two of them the test suite.
  # No secrets and a read-only token in these three: they run npm installs.
  build:
    runs-on: ubuntu-latest
    outputs:
      app-bundle: ${{ steps.stage.outcome == 'success' && 'yes' || 'no' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            spacetimedb/package-lock.json

      - name: Validate and build client
        run: |
          npm ci
          npm ci --prefix mobile
          npm ci --prefix spacetimedb
          npm run check:release
          npm run build:client
          node scripts/check-client-build.mjs

      # The Android app's copy of the same dist. Off until automatic app updates
      # are turned on with: gh variable set OTA_AUTO_PUBLISH --body on
      # A failure here only skips the app update, never the website.
      - name: Stage Android app bundle
        id: stage
        if: vars.OTA_AUTO_PUBLISH == 'on'
        continue-on-error: true
        run: node mobile/scripts/build.mjs --skip-client-build

      - name: Keep site build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true
          retention-days: 1

      - name: Keep app bundle
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-www
          path: mobile/www
          include-hidden-files: true
          retention-days: 1

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            spacetimedb/package-lock.json

      - name: Typecheck client and server
        run: |
          npm ci
          npm ci --prefix mobile
          npm ci --prefix spacetimedb
          npm run typecheck:coop
          npm run typecheck:server

  # The unit suite in four parts at once, split by each file's time
  # (tests/shard-weights.json, `npm run test:weights`) so no part waits on the
  # booted scenarios alone. The split is the same on every run, so a failing
  # file always lands in the same part.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            spacetimedb/package-lock.json

      - name: Unit tests, part ${{ matrix.shard }} of 4
        run: |
          npm ci
          # The shared unit suite includes native bridge tests.
          npm ci --prefix mobile
          npm ci --prefix spacetimedb
          npm run test:unit -- --shard=${{ matrix.shard }}/4

  # Signs the app bundle, attaches it to a GitHub release and writes the signed
  # production feed. Runs no npm installs: only the repo's own Node scripts see
  # the signing key and the write token. Every "nothing to publish" case exits
  # cleanly with a notice; a real failure turns this job red but the web deploy
  # below still goes out (without a new feed).
  android-ota:
    # It attaches a GitHub release, so only for a build that passed everything.
    needs: [build, typecheck, test]
    if: vars.OTA_AUTO_PUBLISH == 'on' && needs.build.outputs.app-bundle == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Check signing secret
        id: secret
        env:
          KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=yes" >> "$GITHUB_OUTPUT"
          else echo "::notice title=Android OTA::Secret OTA_SIGNING_PRIVATE_KEY is not set. Skipping the app update; the website still deploys."; fi

      - name: Restore app bundle
        if: steps.secret.outputs.present == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: mobile-www
          path: mobile/www

      - name: Package, sign and announce
        id: publish
        if: steps.secret.outputs.present == 'yes'
        env:
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: node mobile/scripts/ota/cli.mjs publish --platform android --repo "$GITHUB_REPOSITORY" --out ota-feed/production-android.json

      - name: Keep feed
        if: steps.publish.outputs.published == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: ota-feed
          path: ota-feed
          retention-days: 1

  deploy:
    needs: [build, typecheck, test, android-ota]
    # Deploy once the build, typechecks and tests passed, whether the app update ran, skipped or failed.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.typecheck.result == 'success' && needs.test.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Restore site build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      # Same push, same dist: the feed is served at /ota/production-android.json
      # by both hosts below. A committed public/ota file (a manual rollback or
      # promote) is already in dist; the publish step skips when one exists.
      - name: Add Android update feed
        if: needs.android-ota.outputs.published == 'yes'
        uses: actions/download-artifact@v4
        with:
          name: ota-feed
          path: dist/ota

      # Keep the live production feed when android-ota skipped or failed (unless
      # a committed public/ota/production-android.json is already in dist).
      - name: Preserve live Android update feed
        if: needs.android-ota.outputs.published != 'yes'
        run: |
          if [ ! -f dist/ota/production-android.json ]; then
            if curl -fsSL --max-time 15 "https://wildstatmmo.com/ota/production-android.json?t=$(date +%s)" -o /tmp/live-ota.json \
              && node -e 'const d = JSON.parse(require("fs").readFileSync("/tmp/live-ota.json", "utf8")); if (typeof d.payload !== "string" || typeof d.signature !== "string") process.exit(1);'; then
              mkdir -p dist/ota
              mv /tmp/live-ota.json dist/ota/production-android.json
              echo "Preserved live /ota/production-android.json."
            else
              rm -f /tmp/live-ota.json
              echo "::notice title=Android OTA::No live production-android.json preserved (missing or unavailable)."
            fi
          fi

      # wildstatmmo.com, the main site, so it goes first: GitHub Pages waits for it.
      # On while the repo variable CLOUDFLARE_DEPLOY is "on" (the dashboard's own
      # Git build stays off, or every push deploys twice).
      # The phones read their update feed from wildstatmmo.com, and only this
      # step ships the feed there: the dashboard build has no signing key.
      # A step's own env is not visible to its `if`, so check the secret here.
      - name: Check Cloudflare secrets
        id: cloudflare
        if: vars.CLOUDFLARE_DEPLOY == 'on'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "enabled=${TOKEN:+yes}" >> "$GITHUB_OUTPUT"

      # Labelled in Cloudflare's deployment list with the commit's first line and the game version, as the
      # dashboard's own builds were (without them it reads only "Manually deployed"). Passed through env
      # so quotes in a commit message cannot break the command.
      - name: Deploy to Cloudflare
        if: steps.cloudflare.outputs.enabled == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c1-100)"
          [ -n "$subject" ] || subject="Manual run of $(printf '%s' "$GITHUB_SHA" | cut -c1-8)"
          version="$(node -p "require('./dist/version.json').version" 2>/dev/null || true)"
          npx --yes wrangler@4 deploy --name wildstat --compatibility-date 2026-09-02 --assets ./dist \
            --message "$subject" ${version:+--tag "$version"}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

<title>WildStat UI Studio Frame</title>
<style id="studioBaseStyle">
  html, body { margin: 0; min-height: 100%; background: #14191f; color: #eef3f8; font: 13px/1.35 Arial, sans-serif; }
  body.studio-freeze *, body.studio-freeze *::before, body.studio-freeze *::after {
    animation: none !important; transition: none !important; caret-color: transparent !important;
  }
  .vc-section { padding: 0 0 8px; }
  .vc-title { margin: 0; padding: 6px 8px; font-weight: bold; font-size: 13px; color: #fff; }
  .vc-stage { position: relative; }
  .vc-stage > div { position: absolute !important; }
</style>

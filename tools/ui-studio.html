<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WildStat UI Studio</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #151a22;
    --panel-2: #1c232e;
    --border: rgba(255, 255, 255, 0.11);
    --text: #eef3f8;
    --muted: #93a1b2;
    --accent: #5fe3d6;
    --gold: #ffd34d;
    --green: #34c759;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .studio {
    display: grid;
    grid-template-columns: 256px minmax(0, 1fr) auto;
    grid-template-rows: 48px minmax(0, 1fr);
    height: 100vh;
  }
  .topbar {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 0 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; white-space: nowrap;
  }
  .brand-dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 8px rgba(52, 199, 89, 0.7);
  }
  .scene-meta {
    display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden;
  }
  .scene-title { font-weight: 800; color: #fff; white-space: nowrap; }
  .scene-files {
    color: var(--muted); font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .controls { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
  .seg {
    display: inline-flex; padding: 2px; gap: 2px; border-radius: 8px;
    background: #0c1016; border: 1px solid var(--border);
  }
  .btn {
    padding: 5px 9px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--panel-2); color: var(--text); font: inherit; font-size: 12px; font-weight: 700;
    cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: rgba(255, 255, 255, 0.28); }
  .seg .btn { border: 0; background: transparent; color: var(--muted); border-radius: 6px; }
  .seg .btn.is-active { background: #263344; color: #fff; }
  .btn.is-on { border-color: var(--accent); color: var(--accent); background: rgba(95, 227, 214, 0.12); }

  .sidebar {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border-right: 1px solid var(--border);
  }
  .search-wrap { padding: 10px; border-bottom: 1px solid var(--border); }
  .search-wrap input {
    width: 100%; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: #0d1117; color: var(--text);
    font: inherit; outline: none;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .nav { flex: 1; overflow-y: auto; padding: 8px; }
  .group { margin-bottom: 12px; }
  .group-title {
    margin: 0 0 4px; padding: 0 8px; font-size: 10.5px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  }
  .item {
    width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 7px 9px; margin-bottom: 2px; border: 1px solid transparent; border-radius: 7px;
    background: transparent; color: #d5dfea; text-align: left; font: inherit; font-size: 12.5px; font-weight: 600;
    cursor: pointer;
  }
  .item:hover { background: rgba(255, 255, 255, 0.05); }
  .item.is-active {
    background: rgba(95, 227, 214, 0.13); border-color: rgba(95, 227, 214, 0.42); color: #fff; font-weight: 800;
  }
  .item-tag {
    font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 999px;
    background: rgba(255, 211, 77, 0.14); color: var(--gold);
  }

  .stage {
    position: relative; overflow: auto; display: flex; align-items: center; justify-content: center;
    padding: 20px;
    background:
      radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.06) 1px, transparent 0) 0 0 / 20px 20px,
      #0a0d12;
  }
  .device {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    max-width: 100%; max-height: 100%;
  }
  .device.is-fill { width: 100%; height: 100%; }
  .device-size { font-size: 11px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .bezel {
    border: 2px solid rgba(255, 255, 255, 0.16); border-radius: 18px; overflow: hidden;
    background: #12161c; box-shadow: 0 22px 60px rgba(0, 0, 0, 0.65);
    transition: width 0.16s ease, height 0.16s ease;
  }
  .device.is-fill .bezel { width: 100% !important; height: 100% !important; border-radius: 10px; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #14191f; }

  .drawer {
    width: 310px; display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border-left: 1px solid var(--border);
  }
  .drawer[hidden] { display: none; }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--border); font-weight: 800; font-size: 12.5px;
  }
  .drawer-note { padding: 8px 12px; color: var(--muted); font-size: 11.5px; border-bottom: 1px solid var(--border); }
  .drawer textarea {
    flex: 1; resize: none; border: 0; padding: 12px;
    background: #0d1117; color: #c7f0ff; outline: none;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  }
  .drawer-foot {
    display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--border);
  }
  .drawer-foot .btn { flex: 1; }
  .hmr-pill {
    position: fixed; right: 16px; bottom: 16px; padding: 6px 12px; border-radius: 999px;
    background: rgba(20, 44, 28, 0.94); border: 1px solid rgba(71, 209, 108, 0.6); color: #9ff8b5;
    font-size: 12px; font-weight: 800; pointer-events: none; opacity: 0; transition: opacity 0.2s ease;
  }
  .hmr-pill.is-shown { opacity: 1; }
</style>
</head>
<body>
  <div class="studio">
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span><span>WildStat UI Studio</span></div>
      <div class="scene-meta">
        <span id="sceneTitle" class="scene-title"></span>
        <span id="sceneFiles" class="scene-files"></span>
      </div>
      <div class="controls">
        <div class="seg" id="viewports" role="group" aria-label="Viewport size">
          <button type="button" class="btn is-active" data-vp="phone">Phone</button>
          <button type="button" class="btn" data-vp="small">Small</button>
          <button type="button" class="btn" data-vp="tablet">Tablet</button>
          <button type="button" class="btn" data-vp="desktop">Desktop</button>
          <button type="button" class="btn" data-vp="fill">Fill</button>
        </div>
        <button type="button" class="btn" id="rotateBtn" title="Swap width and height">Rotate</button>
        <button type="button" class="btn" id="freezeBtn" title="Freeze CSS animations">Freeze</button>
        <button type="button" class="btn" id="reloadBtn" title="Reload scene">Reload</button>
        <button type="button" class="btn" id="cssBtn" title="Toggle live CSS tweaker">CSS</button>
      </div>
    </header>

    <aside class="sidebar">
      <div class="search-wrap"><input id="search" type="search" placeholder="Filter UI screens…" autocomplete="off" /></div>
      <nav id="nav" class="nav" aria-label="UI screens"></nav>
    </aside>

    <main class="stage">
      <div id="device" class="device">
        <span id="deviceSize" class="device-size">390 × 844</span>
        <div id="bezel" class="bezel" style="width:390px;height:844px;">
          <iframe id="preview" title="WildStat UI preview"></iframe>
        </div>
      </div>
    </main>

    <aside id="cssDrawer" class="drawer" hidden>
      <div class="drawer-head"><span>Live CSS Tweaker</span><span id="cssStatus" style="color:var(--muted);font-weight:600;font-size:11px;">Instant preview</span></div>
      <div class="drawer-note">Edits inject live into the preview frame. Saving <code>public/assets/wildstat/game.css</code> also hot-reloads automatically.</div>
      <textarea id="cssInput" spellcheck="false" placeholder="/* Example:
.cook-fish-card {
  border-radius: 14px;
}
*/"></textarea>
      <div class="drawer-foot">
        <button type="button" class="btn" id="copyCssBtn">Copy CSS</button>
        <button type="button" class="btn" id="clearCssBtn">Clear</button>
      </div>
    </aside>
  </div>
  <div id="hmrPill" class="hmr-pill">CSS hot-reloaded</div>
  <script type="module" src="./ui-studio/studio.ts"></script>
</body>
</html>
